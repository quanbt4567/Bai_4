<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=Lora:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="header">
    <div class="logo">Logo</div>
    <div class="menu">Menu</div>
    <div class="button">Button</div>
  </header>

  <section class="hero">
    <div class="placeholder hero__content">Content</div>
    <div class="placeholder hero__image">Image</div>
  </section>

  <section class="section">
    <div class="section-title">Title</div>
    <div class="grid grid--three">
      <div class="placeholder card">Item</div>
      <div class="placeholder card">Item</div>
      <div class="placeholder card">Item</div>
      <div class="placeholder card">Item</div>
      <div class="placeholder card">Item</div>
      <div class="placeholder card">Item</div>
    </div>
  </section>

  <section class="section section--muted">
    <div class="section-title">Title</div>
    <div class="grid grid--five">
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">Title</div>
    <div class="grid grid--four">
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
      <div class="placeholder card card--compact">Item</div>
    </div>
  </section>

  <footer class="footer">Footer</footer>

</body>

</html>
